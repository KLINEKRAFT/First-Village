<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ASTRA // First Village</title>
<style>
:root{--bg:#0a0b09;--p:#11130f;--p2:#171a14;--line:#2c3026;--text:#eeeadd;--muted:#989b8b;--good:#96bd78;--bad:#d97967;--accent:#d2c49a}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 Inter,system-ui,sans-serif}button,select{font:inherit;color:inherit;background:var(--p2);border:1px solid var(--line);border-radius:7px;padding:7px 9px}button{cursor:pointer}.primary{background:#e9e1c9;color:#181914;font-weight:800}#app{height:100%;display:grid;grid-template-rows:48px 1fr}header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.13em}.brand em{font-style:normal;color:var(--accent)}#status{color:var(--muted);margin-right:auto}main{min-height:0;display:grid;grid-template-columns:280px 1fr 350px}aside{min-height:0;overflow:auto;background:var(--p)}#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}.section{padding:12px;border-bottom:1px solid var(--line)}h3{margin:0 0 8px;color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:7px}.metric b{display:block;font-size:16px}.metric span,.small{font-size:10px;color:var(--muted)}.agent{padding:8px;background:#151913;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}.agent:hover,.agent.active{border-color:#4d5541}.row{display:flex;gap:7px;align-items:center}.grow{flex:1}.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}#world{width:100%;height:100%;display:block;background:#151811}#worldWrap{position:relative;min-width:0;min-height:0}.float{position:absolute;background:rgba(10,12,9,.85);border:1px solid var(--line);border-radius:9px;padding:8px 10px;backdrop-filter:blur(10px)}#clock{left:10px;top:10px}#era{left:10px;bottom:10px;max-width:330px}.item{padding:6px 0;border-bottom:1px solid #242820;font-size:11px}.time{color:#737b68}.good{color:var(--good)}.bad{color:var(--bad)}.tag{display:inline-block;font-size:10px;padding:2px 5px;border:1px solid #39402f;border-radius:999px;margin:2px}.barlabel{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin:6px 0 2px}.bar{height:6px;background:#262b22;border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--good)}@media(max-width:1000px){main{grid-template-columns:230px 1fr}#right{display:none}}
</style>
</head>
<body><div id="app">
<header><div class="brand"><em>ASTRA</em> // FIRST VILLAGE</div><div id="status">Hunter-gatherer band</div><button class="primary" id="play">Start</button><select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="20">20×</option><option value="75">75×</option></select><button id="reset">Reset</button></header>
<main><aside id="left"><div class="section"><h3>Settlement</h3><div class="metrics"><div class="metric"><b id="pop">12</b><span>people</span></div><div class="metric"><b id="food">0</b><span>food</span></div><div class="metric"><b id="water">0</b><span>water</span></div><div class="metric"><b id="wood">0</b><span>wood</span></div><div class="metric"><b id="stone">0</b><span>stone</span></div><div class="metric"><b id="know">0</b><span>knowledge</span></div></div></div><div class="section"><h3>People</h3><div id="agents"></div></div></aside>
<section id="worldWrap"><canvas id="world"></canvas><div class="float" id="clock"><b id="clockText">Day 1 · 07:00</b><div class="small" id="weather">Clear · 71°F</div></div><div class="float" id="era"><b id="eraTitle">Wandering band</b><div class="small" id="eraText">They know fire and stone tools. Everything else must emerge.</div></div></section>
<aside id="right"><div class="section"><h3>Selected person</h3><div id="detail" class="small">Select someone.</div></div><div class="section"><h3>History</h3><div id="events"></div></div><div class="section"><h3>Built environment</h3><div id="buildings"></div></div></aside></main></div>
<script src="app.js"></script></body></html>
